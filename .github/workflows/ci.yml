name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves agentic-chaos works with zero agenticlens installed: no sibling
  # checkout, no [tool.uv.sources] override in play, just the core package.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --frozen: uv.lock resolves the agenticlens extra too (a local path
      # source), so a normal `uv sync`/`uv run` tries to validate/refresh that
      # entry even when the extra isn't requested -- and fails here since
      # there's no sibling agenticlens checkout in this job. --frozen installs
      # straight from the committed lock without touching it.
      - name: Install dependencies (no agenticlens extra)
        run: uv sync --extra dev --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy)
        run: uv run --frozen mypy

      - name: Test (pytest) -- agenticlens integration tests auto-skip via importorskip
        run: uv run --frozen pytest

  # Covers agentic_chaos.integrations.agenticlens, which needs the optional
  # extra installed. Both checkouts land as siblings under $GITHUB_WORKSPACE
  # (.../agentic-chaos and .../agenticlens) so agentic-chaos's
  # `[tool.uv.sources] agenticlens = { path = "../agenticlens" }` resolves
  # correctly. actions/checkout refuses paths outside the workspace, so a
  # literal `../agenticlens` path doesn't work here.
  test-agenticlens-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          path: agentic-chaos

      - name: Check out agenticlens (local dependency, not yet published with chaos_events support)
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with the optional agenticlens extra)
        working-directory: agentic-chaos
        run: uv sync --extra dev --extra agenticlens --python 3.12

      - name: Type check (mypy) -- exercises the integration module against the real package
        working-directory: agentic-chaos
        run: uv run mypy

      - name: Test (pytest)
        working-directory: agentic-chaos
        run: uv run pytest

  # Proves the built distribution's own metadata has no hard agenticlens
  # dependency -- built with only the core dev extra, no sibling checkout.
  package:
    runs-on: ubuntu-latest
    needs: [test, test-agenticlens-integration]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      # --frozen: see the comment on the same flag in test-core -- no sibling
      # agenticlens checkout here, and the agenticlens extra isn't requested.
      - name: Install dependencies
        run: uv sync --extra dev --frozen --python 3.12
      - name: Build distributions
        run: |
          uv run --frozen python -m build
          uv run --frozen python -m twine check dist/*
