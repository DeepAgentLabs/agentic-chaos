name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves agentic-chaos works with zero agenticlens installed: no sibling
  # checkout, no [tool.uv.sources] override in play, just the core package.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --frozen: uv.lock resolves the agenticlens extra too (a local path
      # source), so a normal `uv sync`/`uv run` tries to validate/refresh that
      # entry even when the extra isn't requested -- and fails here since
      # there's no sibling agenticlens checkout in this job. --frozen installs
      # straight from the committed lock without touching it.
      - name: Install dependencies (no agenticlens extra)
        run: uv sync --extra dev --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy)
        run: uv run --frozen mypy

      - name: Test (pytest) -- agenticlens integration tests auto-skip via importorskip
        run: uv run --frozen pytest

  # Covers agentic_chaos.integrations.agenticlens, which needs the optional
  # extra installed. Both checkouts land as siblings under $GITHUB_WORKSPACE
  # (.../agentic-chaos and .../agenticlens) so agentic-chaos's
  # `[tool.uv.sources] agenticlens = { path = "../agenticlens" }` resolves
  # correctly. actions/checkout refuses paths outside the workspace, so a
  # literal `../agenticlens` path doesn't work here.
  test-agenticlens-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out agentic-chaos
        uses: actions/checkout@v7
        with:
          path: agentic-chaos

      - name: Check out agenticlens (local dependency, not yet published with chaos_events support)
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Check out Control Tower native artifact reader
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticops-control-tower
          path: agenticops-control-tower
      - name: Check out ai-operations-spec (AIOS run export schema check)
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/ai-operations-spec
          path: ai-operations-spec
      - name: Check out MCP fault discovery adapter
        uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/mcp-server
          path: mcp-server

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with the optional agenticlens extra)
        working-directory: agentic-chaos
        run: uv sync --extra dev --extra agenticlens --python 3.12

      - name: Type check (mypy) -- exercises the integration module against the real package
        working-directory: agentic-chaos
        run: uv run mypy

      - name: Test (pytest)
        working-directory: agentic-chaos
        run: uv run pytest

  test-provider-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install optional SDKs
        run: uv sync --frozen --extra dev --extra providers --python 3.12
      - name: Real SDK smoke tests (no provider network calls)
        run: uv run --frozen pytest tests/test_provider_sdks.py

  # Proves the built distribution's own metadata has no hard agenticlens
  # dependency -- built with only the core dev extra, no sibling checkout.
  package:
    runs-on: ubuntu-latest
    needs: [test, test-agenticlens-integration, test-provider-sdks]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      # --frozen: see the comment on the same flag in test-core -- no sibling
      # agenticlens checkout here, and the agenticlens extra isn't requested.
      - name: Install dependencies
        run: uv sync --extra dev --frozen --python 3.12
      - name: Build distributions
        run: |
          uv run --frozen python -m build
          uv run --frozen python -m twine check dist/*
      - name: Verify clean Python 3.10 wheel install (no dev extras)
        run: |
          uv python install 3.10
          uv venv --python 3.10 /tmp/chaos-wheel-smoke
          uv pip install --python /tmp/chaos-wheel-smoke/bin/python dist/*.whl
          /tmp/chaos-wheel-smoke/bin/python -c "import tomli, agentic_chaos; from importlib.metadata import version; assert agentic_chaos.__version__ == version('agentic-chaos'), (agentic_chaos.__version__, version('agentic-chaos')); print('Python 3.10 wheel import passed')"
      - name: Verify the wheel ships the pytest plugin entry point
        run: |
          /tmp/chaos-wheel-smoke/bin/python -c "from importlib.metadata import entry_points; eps = {ep.name: ep.value for ep in entry_points(group='pytest11')}; assert eps.get('agentic_chaos') == 'pytest_agentic_chaos.plugin', eps; print('pytest11 entry point present')"
          uv pip install --python /tmp/chaos-wheel-smoke/bin/python "pytest>=8"
          /tmp/chaos-wheel-smoke/bin/python -m pytest --help | grep -q -- "--chaos"
          # Run the example suite from a copy outside the repo, so the repo's
          # pytest config (pythonpath = src) cannot mask the installed wheel.
          mkdir -p /tmp/chaos-example/examples
          cp -r examples/pytest_chaos examples/chaos.toml /tmp/chaos-example/examples/
          cd /tmp/chaos-example
          /tmp/chaos-wheel-smoke/bin/python -m pytest examples/pytest_chaos --chaos -q -p no:cacheprovider
      - name: Verify declarative experiments from the installed wheel
        run: |
          mkdir -p /tmp/chaos-experiments
          cp -r examples/workflows /tmp/chaos-experiments/
          cd /tmp/chaos-experiments
          # Without the yaml extra, YAML files explain how to enable them.
          if /tmp/chaos-wheel-smoke/bin/agentic-chaos experiment validate workflows/rate-limit-recovery.yaml > out.txt; then exit 1; fi
          grep -q "agentic-chaos\[yaml\]" out.txt
          uv pip install --python /tmp/chaos-wheel-smoke/bin/python "pyyaml>=6"
          /tmp/chaos-wheel-smoke/bin/agentic-chaos experiment validate --strict workflows/*.yaml
          /tmp/chaos-wheel-smoke/bin/agentic-chaos experiment run workflows/rate-limit-recovery.yaml --no-input
          /tmp/chaos-wheel-smoke/bin/agentic-chaos chaos workflow run workflows/resilience-suite.yaml --no-input --approve approve-escalation
