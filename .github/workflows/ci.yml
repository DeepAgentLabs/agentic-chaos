name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Both checkouts land as siblings under $GITHUB_WORKSPACE
      # (.../agentic-chaos and .../agenticlens) so agentic-chaos's
      # `[tool.uv.sources] agenticlens = { path = "../agenticlens" }`
      # resolves correctly. actions/checkout refuses paths outside the
      # workspace, so a literal `../agenticlens` path doesn't work here.
      - name: Check out agentic-chaos
        uses: actions/checkout@v4
        with:
          path: agentic-chaos

      - name: Check out agenticlens (local dependency)
        uses: actions/checkout@v4
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: agentic-chaos
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        working-directory: agentic-chaos
        run: uv run ruff check .

      - name: Format check (ruff format)
        working-directory: agentic-chaos
        run: uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: agentic-chaos
        run: uv run mypy

      - name: Test (pytest)
        working-directory: agentic-chaos
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out agentic-chaos
        uses: actions/checkout@v4
        with:
          path: agentic-chaos
      - name: Check out agenticlens (local dependency)
        uses: actions/checkout@v4
        with:
          repository: DeepAgentLabs/agenticlens
          path: agenticlens
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: agentic-chaos
        run: uv sync --extra dev --python 3.12
      - name: Build distributions
        working-directory: agentic-chaos
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
