[profiles.production-like]
faults = ["rate_limit_storm", "token_timeout"]
probability = 0.1
seed = 42

[profiles.stress-test]
faults = ["rate_limit_storm", "silent_degradation", "token_timeout"]
probability = 0.8
seed = 42

[profiles.streaming-demo]
faults = ["stream_cut"]
probability = 1.0

[profiles.streaming-demo.parameters.stream_cut]
after_chunks = 2

# Used by examples/pytest_chaos (agentic-chaos 0.6 pytest plugin).
[profiles.ci]
faults = ["rate_limit_storm"]
seed = 7

[profiles.ci.parameters.rate_limit_storm]
burst_count = 2
