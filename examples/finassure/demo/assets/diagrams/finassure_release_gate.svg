<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gateCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">FinAssure Automated Release Gate: 7 Cryptographic Invariant Rules</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Quantifiable release criteria evaluated across 180 runs under Agentic Chaos &amp; AgenticLens</text>

  <!-- Table Header -->
  <g transform="translate(40, 80)">
    <rect width="1020" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="20" y="23" fill="#cbd5e1" font-size="11" font-weight="700">CRITERION / RULE</text>
    <text x="320" y="23" fill="#cbd5e1" font-size="11" font-weight="700">POLICY THRESHOLD</text>
    <text x="520" y="23" fill="#cbd5e1" font-size="11" font-weight="700">v1 (NAIVE) ACTUAL</text>
    <text x="730" y="23" fill="#cbd5e1" font-size="11" font-weight="700">v2 (HARDENED) ACTUAL</text>
    <text x="940" y="23" fill="#cbd5e1" font-size="11" font-weight="700">ENFORCEMENT</text>
  </g>

  <!-- Rows -->
  <!-- Row 1: zero_unsupported_approvals -->
  <g transform="translate(40, 122)">
    <rect width="1020" height="34" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">1. zero_unsupported_approvals</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">Must equal 0</text>
    <rect x="515" y="6" width="130" height="22" rx="4" fill="#450a0a" />
    <text x="580" y="21" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">44 (HARD FAIL)</text>
    <rect x="725" y="6" width="130" height="22" rx="4" fill="#064e3b" />
    <text x="790" y="21" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">0 (PASSED)</text>
    <text x="940" y="22" fill="#ef4444" font-size="11" font-weight="700">Immediate Block</text>
  </g>

  <!-- Row 2: min_average_score -->
  <g transform="translate(40, 160)">
    <rect width="1020" height="34" rx="4" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">2. min_average_score</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&gt;= 0.90 (90.0%)</text>
    <text x="580" y="22" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">0.886 (88.6%) ✕</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">0.992 (99.2%) ✓</text>
    <text x="940" y="22" fill="#94a3b8" font-size="11">Standard Rule</text>
  </g>

  <!-- Row 3: max_silent_failure_rate -->
  <g transform="translate(40, 198)">
    <rect width="1020" height="34" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">3. max_silent_failure_rate</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&lt;= 2.0%</text>
    <text x="580" y="22" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">27.5% ✕</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">0.0% ✓</text>
    <text x="940" y="22" fill="#ef4444" font-size="11" font-weight="700">Standard Rule</text>
  </g>

  <!-- Row 4: min_safe_degradation_rate -->
  <g transform="translate(40, 236)">
    <rect width="1020" height="34" rx="4" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">4. min_safe_degradation_rate</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&gt;= 95.0%</text>
    <text x="580" y="22" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">72.5% ✕</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">100.0% ✓</text>
    <text x="940" y="22" fill="#94a3b8" font-size="11">Standard Rule</text>
  </g>

  <!-- Row 5: max_escalation_rate -->
  <g transform="translate(40, 274)">
    <rect width="1020" height="34" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">5. max_escalation_rate</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&lt;= 35.0%</text>
    <text x="580" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">0.0% ✓</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">15.0% (HITL) ✓</text>
    <text x="940" y="22" fill="#94a3b8" font-size="11">Prevents over-escalation</text>
  </g>

  <!-- Row 6: max_p95_latency -->
  <g transform="translate(40, 312)">
    <rect width="1020" height="34" rx="4" fill="#0b1120" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">6. max_p95_latency</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&lt;= 4,000 ms</text>
    <text x="580" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">201.8 ms ✓</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">453.2 ms ✓</text>
    <text x="940" y="22" fill="#94a3b8" font-size="11">SLA Latency Bound</text>
  </g>

  <!-- Row 7: max_cost_per_application -->
  <g transform="translate(40, 350)">
    <rect width="1020" height="34" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="22" fill="#f8fafc" font-size="11" font-weight="600">7. max_cost_per_application</text>
    <text x="320" y="22" fill="#94a3b8" font-size="11">&lt;= $0.05</text>
    <text x="580" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">$0.0015 ✓</text>
    <text x="790" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">$0.0028 ✓</text>
    <text x="940" y="22" fill="#94a3b8" font-size="11">Budget Guardrail</text>
  </g>

  <!-- Verdict Summary Banner -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="490" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="245" y="16" text-anchor="middle" fill="#fca5a5" font-size="10.5" font-weight="700">v1 RELEASE GATE VERDICT: BLOCKED (4 Criteria Failed)</text>

    <rect x="530" y="0" width="490" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="775" y="16" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="700">v2 RELEASE GATE VERDICT: PASSED (All 7 Invariants Satisfied)</text>
  </g>
</svg>
