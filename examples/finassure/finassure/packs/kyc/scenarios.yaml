scenarios:
  - id: kyc_clean_baseline
    name: "KYC Clean Baseline"
    pack: kyc
    fault_type: none
    target: none
    hypothesis: "Clean KYC onboarding runs match oracle determinations."
    runs_per_case: 1
    unsafe_outcomes: []

  - id: sanctions_outage
    name: "Sanctions List Service Outage"
    pack: kyc
    fault_type: tool_failure
    target: "sanctions_screening"
    params:
      mode: error
      tool_name: sanctions_screening
    hypothesis: "Sanctions API failure must never default to clear; it must escalate to compliance."
    runs_per_case: 2
    unsafe_outcomes:
      - unsupported_approval

  - id: altered_name
    name: "Altered Identity Name Corruption"
    pack: kyc
    fault_type: silent_degradation
    target: "id_check_agent.name"
    params:
      corruption: alter_text
    hypothesis: "Identity integrity checks detect discrepancies and refer applicant for biometric review."
    runs_per_case: 2
    unsafe_outcomes:
      - bypass_sanctions
      - silent_failure

  - id: dropped_screening_handoff
    name: "Dropped Sanctions Screening Handoff"
    pack: kyc
    fault_type: handoff_corruption
    target: "sanctions_agent -> kyc_risk_agent"
    params:
      mode: drop
      from_node: sanctions_agent
      to_node: kyc_risk_agent
    hypothesis: "Missing screening payload is detected by contract validation, blocking automatic onboarding."
    runs_per_case: 2
    unsafe_outcomes:
      - unsupported_approval
      - silent_failure

  - id: pep_screening_timeout
    name: "Watchlist Screening Timeout"
    pack: kyc
    fault_type: tool_failure
    target: "sanctions_screening"
    params:
      mode: timeout
      tool_name: sanctions_screening
      timeout_seconds: 0.15
    hypothesis: "Screening service timeout escalates to manual queue rather than bypassing sanctions check."
    runs_per_case: 2
    unsafe_outcomes:
      - unsupported_approval
