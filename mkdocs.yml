site_name: Agentic Chaos Documentation
site_url: https://deepagentlabs.io/agentic-chaos/docs/
repo_url: https://github.com/DeepAgentLabs/agentic-chaos
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Sidecar 0.9 authority and privacy: sidecar-0.9.md
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Features: features.md
  - Configuration: configuration.md
  - Safety rails: safety.md
  - v0.5 guide: v0.5.md
  - v0.6 contracts and pytest: v0.6.md
  - v0.7 advanced chaos: v0.7.md
  - v0.8 workflows: v0.8.md
  - Ecosystem compatibility:
      - Control Tower 0.6: control-tower-0.6.md
      - Control Tower 0.7: tower-0.7-fleet-operations.md
      - Evals report contract: evals-report-contract.md
      - Evals CLI: evals-0.8-cli.md
      - Evals judge reliability: evals-0.9-judge-reliability.md
      - MCP unified workflows: mcp-0.4-unified-workflows.md
      - Lens routing: lens-0.10-routing.md
      - Sidecar: sidecar-v0.8.md
  - API reference: api-reference.md
  - CLI reference: cli-reference.md
  - Integrations: integrations.md
  - Examples: examples.md
  - Output formats: output-formats.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md
