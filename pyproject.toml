[build-system]
# Keep the isolated build backend on a metadata-2.4-compatible hatchling line.
# Hatchling 1.27+ can emit Core Metadata 2.5, which current CI's `twine check`
# rejects as an invalid distribution metadata version.
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-chaos"
version = "0.8.0"
description = "Standalone fault injection toolkit for LLM calls and agentic workflows, with an optional AgenticLens integration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agentic-chaos Contributors" }]
keywords = ["llm", "chaos-engineering", "fault-injection", "agents", "resilience", "observability", "pytest", "chaos-workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.0,<3",
  "typer>=0.12",
  "rich>=13.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
providers = ["openai>=1.0", "anthropic>=0.40", "google-genai>=1.0"]
# YAML experiment files (`agentic-chaos experiment ...`); JSON and TOML need nothing extra.
yaml = ["pyyaml>=6.0"]
# The pytest plugin (`pytest --chaos`) needs pytest 8; it is otherwise inert.
pytest = ["pytest>=8.0"]
# Only needed for agentic_chaos.integrations.agenticlens -- core chaos_call()/
# chaos_session()/the CLI never require it. 0.7.0 is the first AgenticLens
# release that diagnoses spans tagged by span_attributes()/mark_span().
agenticlens = [
  "agenticlens>=0.7.0",
]
dev = [
  "tomli>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
agentic-chaos = "agentic_chaos.cli.main:app"

# The pytest plugin ships in this distribution as its own top-level module so
# that loading it (on every pytest run, once installed) imports nothing from
# agentic_chaos until a @pytest.mark.chaos test actually runs with --chaos.
[project.entry-points.pytest11]
agentic_chaos = "pytest_agentic_chaos.plugin"

[project.urls]
Homepage = "https://github.com/DeepAgentLabs/agentic-chaos"
Repository = "https://github.com/DeepAgentLabs/agentic-chaos"
Issues = "https://github.com/DeepAgentLabs/agentic-chaos/issues"
Changelog = "https://github.com/DeepAgentLabs/agentic-chaos/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_chaos", "src/pytest_agentic_chaos"]

[tool.uv.sources]
# Resolve agenticlens from the sibling checkout during local development and in
# the integration CI job, so changes on both sides are tested together.
agenticlens = { path = "../agenticlens", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_chaos", "pytest_agentic_chaos"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentic_chaos", "pytest_agentic_chaos"]
mypy_path = "src"

[[tool.mypy.overrides]]
# agenticlens is optional (only used by agentic_chaos.integrations.agenticlens
# under TYPE_CHECKING) -- don't require it to be installed for `mypy` to pass.
module = "agenticlens.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=agentic_chaos --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agentic_chaos"]
