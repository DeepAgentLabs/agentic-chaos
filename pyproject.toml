[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-chaos"
version = "0.1.0"
description = "Fault injection toolkit for LLM calls and agentic workflows, reporting into AgenticLens's workflow.json format."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agentic-chaos Contributors" }]
keywords = ["llm", "chaos-engineering", "fault-injection", "agents", "resilience", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # 0.1.2 is on PyPI but predates chaos_events/ChaosImpactRecommender support --
  # this needs the not-yet-released version that adds it. See [tool.uv.sources].
  "agenticlens>=0.1.3",
  "pydantic>=2.0,<3",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
agentic-chaos = "agentic_chaos.cli.main:app"

[project.urls]
Homepage = "https://github.com/pramodbn27/agentic-chaos"
Repository = "https://github.com/pramodbn27/agentic-chaos"
Issues = "https://github.com/pramodbn27/agentic-chaos/issues"
Changelog = "https://github.com/pramodbn27/agentic-chaos/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_chaos"]

[tool.uv.sources]
# PyPI's agenticlens is stuck on 0.1.2, which predates chaos_events support --
# resolve from the sibling checkout instead during local development. Remove
# once agenticlens>=0.1.3 (or whatever adds chaos_events) is released.
agenticlens = { path = "../agenticlens", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_chaos"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentic_chaos"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=agentic_chaos --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agentic_chaos"]
