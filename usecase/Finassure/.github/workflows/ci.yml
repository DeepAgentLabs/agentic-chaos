name: FinAssure CI & Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly full matrix at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      matrix_type:
        description: 'Matrix run type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

jobs:
  test-and-gate:
    name: Unit Tests & Automated Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyyaml httpx uvicorn

      - name: Run Test Suite
        run: |
          python -m pytest -v

      - name: Run FinAssure Release Gate (Smoke / Full Matrix)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/seed_baseline.py

      - name: Verify v2 Release Gate Passed
        run: |
          python -c "
          from finassure.core.storage import storage
          verdict = storage.get_latest_verdict('underwriting', 'v2')
          if not verdict:
              print('Error: No v2 verdict generated!')
              exit(1)
          print(f'Underwriting v2 Gate: {verdict.verdict} (Score: {verdict.overall_score})')
          if verdict.verdict != 'PASSED':
              print(f'Release Gate FAILED: {verdict.failure_reasons}')
              exit(1)
          "

      - name: Upload Evidence Packs & Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finassure-evidence-packs
          path: |
            artifacts/evidence_packs/
            artifacts/finassure.sqlite
          retention-days: 14
