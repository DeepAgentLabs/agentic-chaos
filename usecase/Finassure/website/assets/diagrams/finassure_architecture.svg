<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chaosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">FinAssure: Reliability &amp; Release-Gate Harness Architecture</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Domain-Neutral Harness Core with Plug-in Workflow Packs, Agentic Chaos Fault Injection, and AgenticLens Observability</text>

  <!-- Section 1: Workflow Packs -->
  <rect x="50" y="95" width="1000" height="120" rx="12" fill="url(#packGrad)" stroke="#4338ca" stroke-width="1.5" />
  <rect x="70" y="85" width="230" height="22" rx="6" fill="#4338ca" />
  <text x="80" y="100" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">WORKFLOW PACKS (PLUG-INS)</text>

  <!-- Pack 1: Underwriting -->
  <rect x="70" y="120" width="310" height="80" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
  <circle cx="95" cy="142" r="12" fill="#4f46e5" />
  <text x="95" y="146" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">UW</text>
  <text x="120" y="142" fill="#f8fafc" font-size="13" font-weight="700">Loan Underwriting Pack</text>
  <text x="120" y="160" fill="#94a3b8" font-size="10.5">5 Agents: Intake → Extraction → Bureau → Risk → Review</text>
  <text x="120" y="178" fill="#38bdf8" font-size="10" font-weight="600">v1 (Naive) vs v2 (Hardened + Cross-Check)</text>

  <!-- Pack 2: KYC -->
  <rect x="400" y="120" width="300" height="80" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.2" />
  <circle cx="425" cy="142" r="12" fill="#0284c7" />
  <text x="425" y="146" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">KYC</text>
  <text x="450" y="142" fill="#f8fafc" font-size="13" font-weight="700">KYC Onboarding Pack</text>
  <text x="450" y="160" fill="#94a3b8" font-size="10.5">4 Agents: Identity → Sanctions → Rating → Review</text>
  <text x="450" y="178" fill="#38bdf8" font-size="10" font-weight="600">Proves domain-neutral zero-core modification</text>

  <!-- Pack 3: AML -->
  <rect x="720" y="120" width="310" height="80" rx="8" fill="#1e293b" stroke="#0d9488" stroke-width="1.2" />
  <circle cx="745" cy="142" r="12" fill="#0d9488" />
  <text x="745" y="146" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">AML</text>
  <text x="770" y="142" fill="#f8fafc" font-size="13" font-weight="700">AML Triage Pack</text>
  <text x="770" y="160" fill="#94a3b8" font-size="10.5">4 Agents: Ingestion → FATF Screen → Triage → Review</text>
  <text x="770" y="178" fill="#38bdf8" font-size="10" font-weight="600">Transaction structuring &amp; SAR triage rules</text>

  <!-- Connection: Pack to Core -->
  <path d="M 550 215 L 550 245" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="550,250 545,242 555,242" fill="#818cf8" />
  <rect x="440" y="222" width="220" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="550" y="235" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-weight="600">Pack Contract (Agents · Oracle · Scenarios)</text>

  <!-- Section 2: Harness Core -->
  <rect x="50" y="255" width="1000" height="240" rx="12" fill="url(#coreGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="70" y="245" width="220" height="22" rx="6" fill="#334155" />
  <text x="80" y="260" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">DOMAIN-NEUTRAL HARNESS CORE</text>

  <!-- Scenario Loader & Experiment Runner -->
  <rect x="75" y="285" width="250" height="185" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="90" y="310" fill="#38bdf8" font-size="12" font-weight="700">Scenario &amp; Runner Engine</text>
  <text x="90" y="332" fill="#cbd5e1" font-size="10.5">• Scenario Loader (`scenarios.yaml`)</text>
  <text x="90" y="352" fill="#cbd5e1" font-size="10.5">• Synthetic Applicant Generator</text>
  <text x="90" y="372" fill="#cbd5e1" font-size="10.5">• Experiment Matrix Orchestrator</text>
  <text x="90" y="392" fill="#cbd5e1" font-size="10.5">• Fault Injection Coordinates</text>
  <text x="90" y="412" fill="#cbd5e1" font-size="10.5">• Offline &amp; Online Deterministic Engine</text>
  <rect x="90" y="430" width="220" height="24" rx="4" fill="#1e293b" />
  <text x="200" y="446" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">180 Runs per Validation Cycle</text>

  <!-- Interception Layer: Chaos & Lens -->
  <rect x="350" y="285" width="380" height="185" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="365" y="310" fill="#f43f5e" font-size="12" font-weight="700">Chaos Injection &amp; Observability Interceptor</text>
  
  <!-- Agentic Chaos Box -->
  <rect x="365" y="325" width="350" height="65" rx="6" fill="#1e1b24" stroke="#f43f5e" stroke-width="1" />
  <text x="380" y="345" fill="#fda4af" font-size="11.5" font-weight="700">DeepAgentLabs Agentic Chaos</text>
  <text x="380" y="362" fill="#94a3b8" font-size="9.5">• Injects ToolCallFailureFault (bureau outages / timeouts)</text>
  <text x="380" y="377" fill="#94a3b8" font-size="9.5">• SilentDegradationFault (halving income) &amp; Handoff drops</text>

  <!-- AgenticLens Box -->
  <rect x="365" y="400" width="350" height="60" rx="6" fill="#13231e" stroke="#10b981" stroke-width="1" />
  <text x="380" y="420" fill="#6ee7b7" font-size="11.5" font-weight="700">DeepAgentLabs AgenticLens</text>
  <text x="380" y="437" fill="#94a3b8" font-size="9.5">• Full-span profiling (`step`), token counts, execution latency</text>
  <text x="380" y="451" fill="#94a3b8" font-size="9.5">• Native ChaosEvent linking via `attach_events(session, wf)`</text>

  <!-- Release Gate & Evaluator Registry -->
  <rect x="755" y="285" width="275" height="185" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="770" y="310" fill="#a78bfa" font-size="12" font-weight="700">Release Gate &amp; Evaluators</text>
  <text x="770" y="330" fill="#cbd5e1" font-size="10">• Deterministic Policy Oracle</text>
  <text x="770" y="348" fill="#cbd5e1" font-size="10">• Grounded Adverse Reason Judge</text>
  <text x="770" y="366" fill="#cbd5e1" font-size="10">• 7 Cryptographic Release Rules:</text>
  <text x="785" y="384" fill="#34d399" font-size="9.5">✓ zero_unsupported_approvals = 0</text>
  <text x="785" y="399" fill="#34d399" font-size="9.5">✓ min_average_score &gt;= 0.90</text>
  <text x="785" y="414" fill="#34d399" font-size="9.5">✓ max_silent_failure_rate &lt;= 2.0%</text>
  <text x="785" y="429" fill="#34d399" font-size="9.5">✓ min_safe_degradation_rate &gt;= 95%</text>
  <rect x="770" y="438" width="245" height="22" rx="4" fill="#312e81" />
  <text x="892" y="453" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="700">Verdict: PASSED or BLOCKED</text>

  <!-- Horizontal Connections in Core -->
  <path d="M 325 375 L 350 375" stroke="#64748b" stroke-width="2" />
  <polygon points="350,375 344,371 344,379" fill="#64748b" />
  <path d="M 730 375 L 755 375" stroke="#64748b" stroke-width="2" />
  <polygon points="755,375 749,371 749,379" fill="#64748b" />

  <!-- Section 3: Deliverables & Outputs -->
  <path d="M 550 495 L 550 520" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="550,525 545,517 555,517" fill="#818cf8" />

  <rect x="50" y="525" width="1000" height="90" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Deliverable 1 -->
  <rect x="75" y="540" width="290" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="95" y="562" fill="#38bdf8" font-size="12" font-weight="700">Cryptographic Evidence Packs</text>
  <text x="95" y="583" fill="#94a3b8" font-size="10.5">Machine-readable JSON / CSV + Human HTML/MD</text>

  <!-- Deliverable 2 -->
  <rect x="390" y="540" width="300" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="410" y="562" fill="#34d399" font-size="12" font-weight="700">SQLite Trace Index &amp; Audit Trail</text>
  <text x="410" y="583" fill="#94a3b8" font-size="10.5">`finassure.sqlite` local-first run persistence</text>

  <!-- Deliverable 3 -->
  <rect x="715" y="540" width="310" height="60" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <text x="735" y="562" fill="#a5b4fc" font-size="12" font-weight="700">Interactive Web UI &amp; REST API</text>
  <text x="735" y="583" fill="#94a3b8" font-size="10.5">FastAPI Server + Trace Explorer + Live Gate HUD</text>
</svg>
